[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clement-studio-skills-hub"
version = "0.1.0"
description = "Deterministic registry, import and validation for CLEMENT STUDIO skills"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "CLEMENT STUDIO"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
clement-skills-hub = "clement_skills_hub.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clement_skills_hub = ["py.typed"]
